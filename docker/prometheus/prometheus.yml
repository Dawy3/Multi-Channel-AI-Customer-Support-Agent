global:
  scrape_interval: 15s      # Every 15 seconds scrape new metrics
  evaluation_interval: 15s  # Evaluate these metrics every 15 seconds 


scrape_configs:
      

  - job_name: 'fastapi'
    static_configs:
      - targets: ['fastapi:8000'] 
    metrics_path: '/TheNchy135_Dawy_Test_Metrics'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: "/metrics"
  
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']